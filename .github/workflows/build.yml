# Build the EBOOTs with the pspdev toolchain, then run them in PPSSPPHeadless
# and check their stdout.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Keep in step with the local PPSSPPHeadless (see HANDOVER.md).
  PPSSPP_VERSION: v1.20.4

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Install host tools
        # The image is Alpine-based; mpy-cross needs a host C compiler.
        run: apk add --no-cache build-base cmake git python3

      - uses: actions/checkout@v4
        with:
          # Top-level submodules only: the build doesn't use micropython's
          # own submodules (see ports/psp/CMakeLists.txt).
          submodules: true

      # picovector-micropython's core library is its own submodule.
      - name: Fetch picovector's core library
        run: git -C picovector-micropython submodule update --init --depth 1 picovector

      - name: Build hello-world
        run: |
          psp-cmake -S tools/hello -B build/hello -DCMAKE_BUILD_TYPE=Release
          cmake --build build/hello

      - name: Build MicroPython
        run: |
          psp-cmake -S ports/psp -B build/psp -DCMAKE_BUILD_TYPE=Release
          cmake --build build/psp -j"$(nproc)"

      - name: Build MicroPython (test build, with the frozen selftest)
        run: |
          psp-cmake -S ports/psp -B build/psp-test -DCMAKE_BUILD_TYPE=Release -DMICROPY_PSP_TEST_BUILD=ON
          cmake --build build/psp-test -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: eboots
          # The ELFs are kept for psp-addr2line on crash dumps.
          path: |
            build/hello/EBOOT.PBP
            build/hello/hello
            build/psp/EBOOT.PBP
            build/psp/VERSION
            build/psp/micropython
            build/psp-test/EBOOT.PBP
            build/psp-test/micropython

  test:
    needs: build
    # Pinned so the cached PPSSPPHeadless matches the runner's libraries.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install PPSSPP dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev libfontconfig1-dev

      - name: Restore PPSSPPHeadless
        id: ppsspp-cache
        uses: actions/cache@v4
        with:
          path: ppsspp-headless
          key: ppsspp-headless-${{ env.PPSSPP_VERSION }}-ubuntu-24.04

      - name: Build PPSSPPHeadless
        if: steps.ppsspp-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "$PPSSPP_VERSION" --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/hrydgard/ppsspp.git ppsspp-src
          cmake -S ppsspp-src -B ppsspp-src/build -DHEADLESS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build ppsspp-src/build --target PPSSPPHeadless -j"$(nproc)"
          # PPSSPPHeadless looks for assets/ next to itself.
          mkdir -p ppsspp-headless
          cp ppsspp-src/build/PPSSPPHeadless ppsspp-headless/
          cp -r ppsspp-src/build/assets ppsspp-headless/

      - uses: actions/download-artifact@v4
        with:
          name: eboots
          path: build

      - name: Run hello-world
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: |
          tools/run-ppsspp.sh build/hello/EBOOT.PBP 30
          grep -q '^hello: ok$' build/logs/latest/stdout.log

      - name: Run the launcher (no main.py, four scripts)
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: |
          tools/run-ppsspp.sh --files tests/launcher build/psp/EBOOT.PBP 60
          grep -q '^launcher: 4 scripts: countdown.py, error_demo.py, files.py, hello.py$' build/logs/latest/stdout.log

      - name: Run launcher test (runs scripts with scripted button presses)
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: |
          tools/run-ppsspp.sh --files tests/launcher-run build/psp/EBOOT.PBP 60
          grep -q '^launchertest: PASS$' build/logs/latest/stdout.log

      - name: Run MicroPython selftest (test build)
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: |
          tools/run-ppsspp.sh build/psp-test/EBOOT.PBP 60
          grep -q '^selftest: PASS$' build/logs/latest/stdout.log

      - name: Run REPL test (test build, keystrokes from a file)
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: |
          tools/run-ppsspp.sh --files tests/repl build/psp-test/EBOOT.PBP 60
          python3 tests/repl/check.py build/logs/latest/stdout.log

      - name: Run filesystem test
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: |
          tools/run-ppsspp.sh --files tests/fs build/psp/EBOOT.PBP 60
          grep -q '^fstest: PASS$' build/logs/latest/stdout.log

      - name: Run standard-module test
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: |
          tools/run-ppsspp.sh --files tests/modules build/psp/EBOOT.PBP 60
          grep -q '^modtest: PASS$' build/logs/latest/stdout.log

      - name: Run psp module test
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: |
          tools/run-ppsspp.sh --files tests/psp build/psp/EBOOT.PBP 60
          grep -q '^psptest: PASS$' build/logs/latest/stdout.log

      # tests/network/server.py stands in for the internet: PPSSPP's emulated
      # sockets are the runner's own.
      - name: Run network test
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: |
          python3 tests/network/server.py &
          sleep 1
          tools/run-ppsspp.sh --files tests/network build/psp/EBOOT.PBP 90
          grep -q '^nettest: PASS$' build/logs/latest/stdout.log

      - name: Run audio test
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: |
          tools/run-ppsspp.sh --files tests/audio build/psp/EBOOT.PBP 90
          grep -q '^audiotest: PASS$' build/logs/latest/stdout.log

      - name: Run picovector test
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: |
          mkdir -p build/picovector-test
          cp tests/picovector/main.py build/picovector-test/
          cp -R examples/fonts build/picovector-test/
          tools/run-ppsspp.sh --files build/picovector-test build/psp/EBOOT.PBP 60
          grep -q '^pvtest: PASS$' build/logs/latest/stdout.log

      - name: Run the examples
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: |
          mkdir -p build/examples-test
          cp tests/examples/main.py examples/*.py build/examples-test/
          cp -R examples/fonts examples/demos examples/assets build/examples-test/
          tools/run-ppsspp.sh --files build/examples-test build/psp/EBOOT.PBP 90
          grep -q '^examplestest: PASS$' build/logs/latest/stdout.log

      - name: Run the demos (each one a few frames)
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: |
          mkdir -p build/demos-test
          cp tests/demos/main.py build/demos-test/
          cp -R examples/demos examples/assets examples/fonts build/demos-test/
          tools/run-ppsspp.sh --files build/demos-test build/psp/EBOOT.PBP 120
          grep -q '^demostest: PASS$' build/logs/latest/stdout.log

      # The test suite lives in the micropython submodule; its own nested
      # submodules (lib/) aren't needed to run it.
      - name: Fetch MicroPython's test suite
        run: git submodule update --init --depth 1 micropython

      - name: Run MicroPython's test suite
        env:
          PPSSPP_HEADLESS: ${{ github.workspace }}/ppsspp-headless/PPSSPPHeadless
        run: tools/run-mp-tests.sh -j"$(nproc)"

      # After every test has passed, so a release zip is only made from a
      # build that works.
      - name: Make the release zip
        run: tools/make-release.sh build/psp/EBOOT.PBP

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/release/*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-logs
          path: |
            build/logs/
            build/mp-tests/

  # Pushing a tag such as v0.1.0 publishes the tested zip as a GitHub release.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      # If the release was already made by hand (with written notes), attach
      # the zip to it; otherwise create it with generated notes.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
